<title>Abismo Estelar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Chakra+Petch:wght@400;600&display=swap">
<style>
/* Layout: cabina arcade — una pantalla 16:9 centrada sobre negro, cabecera fina, barra co-op y leyenda de controles abajo */
:root {
  color-scheme: dark;
  --void: #04060c;
  --hull: #142036;
  --steel: #9fb3c8;
  --ink: #e6eef6;
  --dim: #5f7189;
  --hawk: #ffc93c;
  --wing: #4dffd2;
  --display: "Silkscreen", "Courier New", monospace;
  --body: "Chakra Petch", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--body); }
.wrap {
  height: 100%; box-sizing: border-box; max-width: 1180px; margin-inline: auto;
  display: flex; flex-direction: column; gap: 10px;
  padding-inline: 16px; padding-block: 12px;
}
header { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.2rem; letter-spacing: .08em; margin: 0; color: var(--hawk); }
h1 span { color: var(--dim); font-weight: 400; font-size: .7rem; letter-spacing: .14em; margin-left: .6em; }
.btns { display: flex; gap: 8px; }
.btn {
  font-family: var(--display); font-size: .72rem; letter-spacing: .06em;
  background: var(--hull); color: var(--ink); border: 1px solid var(--dim);
  border-radius: 3px; padding: 6px 10px; cursor: pointer;
}
.btn:hover { border-color: var(--steel); }
.btn:focus-visible { outline: 2px solid var(--hawk); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.go { border-color: var(--wing); color: var(--wing); }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; background: #000; border: 1px solid var(--hull); border-radius: 3px; touch-action: none; max-width: 100%; }
canvas:focus { outline: none; }
.net {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  border: 1px solid var(--hull); border-radius: 3px; padding: 8px 12px;
}
.net-label { font-family: var(--display); font-size: .72rem; letter-spacing: .08em; color: var(--wing); }
.net-status { flex: 1 1 220px; min-width: 0; color: var(--steel); font-size: .86rem; }
.net-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.rotate { display: none; text-align: center; color: var(--hawk); font-family: var(--display); font-size: .7rem; letter-spacing: .06em; margin: 0; }
@media (orientation: portrait) and (max-width: 640px) { .rotate { display: block; } }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; color: var(--steel); font-size: .82rem; }
kbd {
  font-family: var(--display); font-size: .66rem; color: var(--ink);
  border: 1px solid var(--dim); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px;
}
</style>

<div class="wrap">
  <header>
    <h1>ABISMO ESTELAR<span>SHOOT 'EM UP</span></h1>
    <div class="btns">
      <button id="btnSound" class="btn" type="button">SONIDO: SÍ</button>
      <button id="btnPause" class="btn" type="button">PAUSA</button>
    </div>
  </header>
  <div class="stage"><canvas id="game" tabindex="0" aria-label="Pantalla del juego Abismo Estelar"></canvas></div>
  <p class="rotate">GIRA EL MÓVIL PARA JUGAR A PANTALLA COMPLETA</p>
  <div class="net" id="net">
    <span class="net-label">MULTIJUGADOR</span>
    <span class="net-status" id="netStatus">Conectando con la sala…</span>
    <div class="net-actions" id="netActions"></div>
  </div>
  <div class="legend">
    <span><kbd>←↑↓→</kbd> / <kbd>WASD</kbd> mover</span>
    <span><kbd>ESPACIO</kbd> / <kbd>Z</kbd> disparar (mantener)</span>
    <span><kbd>P</kbd> pausa · <kbd>M</kbd> sonido</span>
    <span>Móvil: arrastra el dedo, la nave dispara sola</span>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 480, H = 270, SCROLL = 40, BOSS_AT = 48, MAX_DEPTH = 5;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const stage = document.querySelector('.stage');
const btnSound = document.getElementById('btnSound');
const btnPause = document.getElementById('btnPause');

const ZONES = ['Arrecife Orbital','Fosa Carmesí','Corriente Helada','Bosque de Kelp','Ruinas Hundidas','Mar de Ceniza',
  'Abismo Turquesa','Volcán Submarino','Jardín de Medusas','Cañón de Hierro','Nebulosa Salina','Cementerio de Naves',
  'Lago de Plasma','Grieta Polar','Templo Coralino','Núcleo Ardiente','Mar de Cristal','Arrecife Fantasma',
  'Ojo del Leviatán','Marea Negra','Trono Abisal'];
const BOSSES = ['CELACANTO DE HIERRO','ANGUILA DE CROMO','RAYA ABISAL','PEZ LINTERNA REY',
  'BARRACUDA DE GUERRA','NAUTILO TITÁN','MORENA DE PLASMA'];
const BOSS_DIMS = [[60, 28], [72, 22], [56, 26]];
const ITEM_COL = { red: '#ff4a4a', green: '#3dff7a', blue: '#45a8ff' };
const ITEM_TXT = { red: 'M', green: 'B', blue: 'E' };
const TYPES = ['fish', 'dart', 'turret', 'jelly', 'carrier', 'mini'];
const ICODE = [null, 'red', 'green', 'blue'];
const STATES = ['title', 'play', 'branch', 'over'];
const PHASES = ['waves', 'warn', 'boss'];
const MAX_PLAYERS = 4;
const P_COL = ['#ffc93c', '#4dffd2', '#ff7ad9', '#a8ff5c'];
const P_HUE = [45, 160, 310, 95];
const SHIP = [
  { flame: '#7fe3ff', wing: '#7d8ea3', hull: '#d5e0ea', stripe: '#8496ab' },
  { flame: '#ffd27f', wing: '#2f8f8a', hull: '#c8f5ec', stripe: '#3fa597' },
  { flame: '#9fe3ff', wing: '#8f3f7f', hull: '#f5d3ec', stripe: '#b0559c' },
  { flame: '#ffb36b', wing: '#5b8a2a', hull: '#e3f5c8', stripe: '#79a83f' }
];

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- Escalado ---------- */
let k = 1;
function fit() {
  const r = stage.getBoundingClientRect();
  let w = r.width, h = w * 9 / 16;
  if (h > r.height && r.height > 100) { h = r.height; w = h * 16 / 9; }
  w = Math.max(240, Math.floor(w)); h = Math.floor(w * 9 / 16);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  k = cv.width / W;
}
new ResizeObserver(fit).observe(stage);
fit();

/* ---------- Récord ---------- */
let hi = 0;
try { hi = +localStorage.getItem('abismo-hi') || 0; } catch (e) {}
function saveHi() { try { localStorage.setItem('abismo-hi', String(hi)); } catch (e) {} }

/* ---------- Audio (sintetizado) ---------- */
let ac = null, master = null, noiseBuf = null, muted = false;
try { muted = localStorage.getItem('abismo-mute') === '1'; } catch (e) {}
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { ac = null; }
}
function tone(freq, dur, type = 'square', vol = 0.1, slide = 0, t0) {
  if (!ac || muted) return;
  const t = t0 ?? ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 900) {
  if (!ac || muted) return;
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t);
  f.frequency.exponentialRampToValueAtTime(60, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  shot() { tone(1250, 0.045, 'square', 0.018, 0.45); },
  hit() { tone(260, 0.04, 'square', 0.03, 0.6); },
  boom() { noise(0.35, 0.22, 1200); },
  big() { noise(1.4, 0.4, 600); tone(90, 1.2, 'sawtooth', 0.12, 0.25); },
  die() { noise(0.9, 0.35, 900); tone(500, 0.9, 'sawtooth', 0.1, 0.08); },
  shield() { tone(700, 0.15, 'triangle', 0.08, 0.5); },
  item() { if (!ac) return; [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.09, 'triangle', 0.09, 0, ac.currentTime + i * 0.06)); },
  warn() { if (!ac) return; for (let j = 0; j < 7; j++) tone(j % 2 ? 620 : 880, 0.42, 'sawtooth', 0.05, 0, ac.currentTime + j * 0.5); }
};
const BASS = [0,0,12,0, 3,0,15,3, 5,5,17,5, 7,7,19,10];
const LEAD = [12,null,15,17, 19,null,17,15, 12,null,10,12, 15,null,null,null,
              24,null,22,19, 22,null,19,17, 15,null,17,19, 12,null,null,null];
const KEYS = [0, 3, 5, -2, 7, 2];
let nextNote = 0, step = 0;
function musicTick() {
  if (!ac || muted || paused || (state !== 'play' && state !== 'branch')) { if (ac) nextNote = ac.currentTime; return; }
  const sd = boss ? 0.105 : 0.125;
  const root = 55 * Math.pow(2, (KEYS[dep] + (boss ? 1 : 0)) / 12);
  if (nextNote < ac.currentTime) nextNote = ac.currentTime + 0.02;
  while (nextNote < ac.currentTime + 0.15) {
    tone(root * Math.pow(2, BASS[step % 16] / 12), sd * 0.9, 'triangle', 0.09, 0, nextNote);
    const l = LEAD[step % 32];
    if (l !== null && step % 2 === 0) tone(root * 4 * Math.pow(2, l / 12), sd * 1.6, 'square', 0.022, 0, nextNote);
    if (step % 4 === 0) tone(boss ? 160 : 120, 0.06, 'sine', 0.08, 0.3, nextNote);
    step++; nextNote += sd;
  }
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.value = m ? 0 : 0.5;
  btnSound.textContent = 'SONIDO: ' + (m ? 'NO' : 'SÍ');
  try { localStorage.setItem('abismo-mute', m ? '1' : '0'); } catch (e) {}
}
setMuted(muted);

/* ---------- Estado ---------- */
let state = 'title', paused = false, time = 0, scroll = 0, shake = 0;
let score = 0, nextExtra = 40000, dep = 0, lane = 0, loop = 0, eid = 0;
let phase = 'waves', zoneT = 0, spawnT = 0, warnT = 0, zoneCard = 0, branchT = 0, overT = 0, newHi = false;
let P, PL = [], boss = null;   // P = nave de esta pantalla (jugador 1 en anfitrión/solo); PL = todas las naves
let shots = [], bombs = [], eshots = [], enemies = [], parts = [], items = [], floaters = [];

const zi = () => dep * (dep + 1) / 2 + lane;
const letter = (d = dep, l = lane) => String.fromCharCode(65 + d * (d + 1) / 2 + l);
const zoneHue = () => (200 + zi() * 67) % 360;
const diff = () => 1 + dep * 0.22 + loop * 0.7;
const players = () => PL;
const multi = () => PL.length > 1;

function floorY(x) { const s = x + scroll; return H - 14 - 6 * Math.sin(s * 0.013) - 4 * Math.sin(s * 0.031 + 1.3); }
function ceilY(x) { const s = x + scroll; return 9 + 4 * Math.sin(s * 0.017 + 2) + 3 * Math.sin(s * 0.043); }
const SPAWN = [H / 2 - 40, H / 2 + 40, H / 2 - 13, H / 2 + 13];
const spawnY = (id, coop) => coop ? SPAWN[id] : H / 2;

const STARS = Array.from({ length: 70 }, () => ({ x: rnd(0, W), y: rnd(0, H), z: rnd(0.15, 1) }));

function newPlayer(id, coop) {
  return { id, x: 60, y: spawnY(id, coop), lives: 3, shot: 0, bomb: 0, arm: 0, inv: 2.5, fireCd: 0, bombCd: 0,
    alive: true, respawnT: 0, tilt: 0, out: false, sp: 0, firing: false, hitsSeen: 0 };
}
function clearWorld() { shots = []; bombs = []; eshots = []; enemies = []; items = []; floaters = []; parts = []; boss = null; }

function startGame() {
  score = 0; nextExtra = 40000; dep = 0; lane = 0; loop = 0;
  const coop = net.mode === 'host' && net.guests.size > 0;
  P = newPlayer(0, coop); PL = [P];
  if (coop) {
    const peers = net.nroom.peers();
    for (const [peer, gi] of net.guests) {
      const pl = newPlayer(gi.id, true), p = peers.find(x => x.peer === peer);
      pl.hitsSeen = p && Number.isFinite(p.presence.h) ? p.presence.h : 0;
      PL.push(pl);
    }
    PL.sort((a, b) => a.id - b.id);
  }
  clearWorld(); newHi = false; paused = false; btnPause.textContent = 'PAUSA';
  startZone();
  if (net.mode === 'host') netUI();
}
function startZone() {
  state = 'play'; phase = 'waves'; zoneT = 0; spawnT = 2.2; zoneCard = 3; warnT = 0;
}
function gameOver() {
  state = 'over'; overT = 0;
  if (score > hi) { hi = score; newHi = true; saveHi(); }
}
function addScore(n, x, y) {
  score += n;
  if (x !== undefined) floaters.push({ x, y, txt: String(n), life: 0.8, c: '#fff' });
  if (score >= nextExtra) {
    nextExtra += 60000; sfx.item();
    for (const p of players()) if (!p.out) { p.lives++; floaters.push({ x: p.x, y: p.y - 14, txt: '1UP', life: 1.4, c: '#ffc93c' }); }
  }
}

/* ---------- Entrada ---------- */
const keys = {};
let touch = null;
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true; audioInit();
  if (e.code === 'KeyM') setMuted(!muted);
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if ((e.code === 'Enter' || e.code === 'Space') && canStart()) startGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const c in keys) keys[c] = false; });
function canStart() { return net.mode !== 'guest' && (state === 'title' || (state === 'over' && overT > 1)); }
function toGame(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit(); cv.focus();
  if (canStart()) startGame();
  if (paused && net.mode !== 'guest') { togglePause(); return; }
  const p = toGame(e);
  touch = { id: e.pointerId, lx: p.x, ly: p.y, dx: 0, dy: 0 };
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
});
cv.addEventListener('pointermove', e => {
  if (!touch || e.pointerId !== touch.id) return;
  const p = toGame(e);
  touch.dx += (p.x - touch.lx) * 1.5; touch.dy += (p.y - touch.ly) * 1.5;
  touch.lx = p.x; touch.ly = p.y;
});
const endTouch = e => { if (touch && e.pointerId === touch.id) touch = null; };
cv.addEventListener('pointerup', endTouch);
cv.addEventListener('pointercancel', endTouch);
function togglePause() {
  if (net.mode === 'guest' || (state !== 'play' && state !== 'branch')) return;
  paused = !paused; btnPause.textContent = paused ? 'SEGUIR' : 'PAUSA';
}
btnSound.addEventListener('click', e => { audioInit(); setMuted(!muted); e.currentTarget.blur(); });
btnPause.addEventListener('click', e => { togglePause(); e.currentTarget.blur(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused) togglePause(); });

/* Mueve una nave con teclado o arrastre; devuelve si está disparando. */
function moveByInput(o, dt) {
  let mx = 0, my = 0;
  if (keys.ArrowLeft || keys.KeyA) mx -= 1;
  if (keys.ArrowRight || keys.KeyD) mx += 1;
  if (keys.ArrowUp || keys.KeyW) my -= 1;
  if (keys.ArrowDown || keys.KeyS) my += 1;
  if (mx && my) { mx *= 0.7071; my *= 0.7071; }
  o.x += mx * 135 * dt; o.y += my * 135 * dt;
  let ty = my;
  if (touch) { o.x += touch.dx; o.y += touch.dy; ty = clamp(touch.dy * 0.5, -1, 1); touch.dx = touch.dy = 0; }
  o.tilt += (ty - o.tilt) * Math.min(1, dt * 10);
  o.x = clamp(o.x, 12, W - 22);
  o.y = clamp(o.y, ceilY(o.x) + 8, floorY(o.x) - 8);
  return !!(keys.Space || keys.KeyZ || keys.KeyJ || touch);
}

/* ---------- Enemigos ---------- */
const DEF = {
  fish: { r: 7, hp: 1, score: 100 }, dart: { r: 7, hp: 2, score: 200 }, turret: { r: 8, hp: 4, score: 300 },
  jelly: { r: 12, hp: 9, score: 500 }, carrier: { r: 13, hp: 14, score: 800 }, mini: { r: 6, hp: 1, score: 50 }
};
function mk(type, o) {
  const d = DEF[type], D = diff();
  return Object.assign({ id: ++eid, type, t: 0, r: d.r, hp: Math.ceil(d.hp * (0.8 + D * 0.2) * crowd()), score: d.score, fireT: rnd(1, 2.5) / D, flash: 0 }, o);
}
/* Con más naves, los enemigos aguantan más. */
function crowd() { return 1 + 0.3 * (PL.length - 1); }
function pickItem() { const r = Math.random(); return r < 0.45 ? 'red' : r < 0.73 ? 'green' : 'blue'; }
function target(x, y) {
  let best = null, bd = Infinity;
  for (const p of players()) { if (!p.alive) continue; const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = p; } }
  return best || P;
}
function aimVec(x, y, spd) { const t = target(x, y), a = Math.atan2(t.y - y, t.x - x); return [Math.cos(a) * spd, Math.sin(a) * spd]; }
function fire(x, y, vx, vy, r = 2.5) { eshots.push({ x, y, vx, vy, r }); }
function fireAt(x, y, spd, r) { const [vx, vy] = aimVec(x, y, spd); fire(x, y, vx, vy, r); }
function ring(x, y, n, spd, off = 0) { for (let j = 0; j < n; j++) { const a = off + j / n * Math.PI * 2; fire(x, y, Math.cos(a) * spd, Math.sin(a) * spd); } }
function fan(x, y, n, spread, spd, center) {
  for (let j = 0; j < n; j++) { const a = center + (n === 1 ? 0 : (j / (n - 1) - 0.5) * spread); fire(x, y, Math.cos(a) * spd, Math.sin(a) * spd); }
}

function spawnWave() {
  const D = diff(), r = Math.random();
  if (r < 0.36) {
    const n = 5, base = rnd(55, H - 65), amp = rnd(14, 42), item = Math.random() < 0.55 ? pickItem() : null;
    const form = { count: n, killed: 0, item };
    for (let j = 0; j < n; j++) enemies.push(mk('fish', { x: W + 15 + j * 22, y: base, base, amp, ph: j * 0.6, form, spd: 68 + D * 12 }));
  } else if (r < 0.54) {
    const n = Math.min(5, 2 + Math.floor(D));
    for (let j = 0; j < n; j++) enemies.push(mk('dart', { x: W + 15 + j * 26, y: rnd(35, H - 45), stopX: rnd(290, 410), mode: 0, vx: 0, vy: 0, wait: 1 + j * 0.25 }));
  } else if (r < 0.69) {
    const n = 2 + (D > 1.4 ? 1 : 0);
    for (let j = 0; j < n; j++) enemies.push(mk('turret', { x: W + 15 + j * 70, y: 0, ceil: Math.random() < 0.4 }));
  } else if (r < 0.82) {
    const base = rnd(70, H - 70);
    enemies.push(mk('jelly', { x: W + 20, y: base, base }));
  } else if (r < 0.91) {
    const base = rnd(60, H - 60);
    enemies.push(mk('carrier', { x: W + 20, y: base, base, item: pickItem() }));
  } else {
    const n = 8, item = Math.random() < 0.7 ? pickItem() : null, form = { count: n, killed: 0, item }, top = Math.random() < 0.5;
    for (let j = 0; j < n; j++) enemies.push(mk('fish', { x: W + 15 + j * 16, y: 0, base: top ? 70 : H - 70, amp: 50, ph: j * 0.35 + (top ? 0 : Math.PI), form, spd: 85 + D * 10 }));
  }
}

function updateEnemies(dt) {
  const D = diff();
  for (const e of enemies) {
    e.t += dt; e.flash = Math.max(0, e.flash - dt);
    const tg = target(e.x, e.y);
    const onScreen = e.x < W - 8 && e.x > tg.x + 24;
    switch (e.type) {
      case 'fish':
        e.x -= e.spd * dt; e.y = e.base + Math.sin(e.t * 2.4 + e.ph) * e.amp;
        if (D > 1.25) { e.fireT -= dt; if (e.fireT <= 0) { e.fireT = rnd(2.5, 4.5) / D; if (onScreen && Math.random() < 0.35) fireAt(e.x, e.y, 70 + D * 15); } }
        break;
      case 'dart':
        if (e.mode === 0) {
          e.x += (e.stopX - e.x) * Math.min(1, dt * 2.5);
          if (e.t > e.wait) {
            e.mode = 1; [e.vx, e.vy] = aimVec(e.x, e.y, 210 + D * 25);
            if (D > 1.2) fireAt(e.x, e.y, 80 + D * 15);
          }
        } else { e.x += e.vx * dt; e.y += e.vy * dt; }
        break;
      case 'turret':
        e.x -= SCROLL * dt; e.y = e.ceil ? ceilY(e.x) + 6 : floorY(e.x) - 6;
        e.fireT -= dt;
        if (e.fireT <= 0) { e.fireT = 1.9 / D; if (onScreen) fireAt(e.x, e.y + (e.ceil ? 3 : -3), 85 + D * 18); }
        break;
      case 'jelly':
        e.x -= 26 * dt; e.y = e.base + Math.sin(e.t * 1.3) * 16;
        e.fireT -= dt;
        if (e.fireT <= 0) { e.fireT = 2.7 / D; if (e.x < W - 15) ring(e.x, e.y, Math.round(6 + D * 3), 55 + D * 14, e.t); }
        break;
      case 'carrier':
        e.x -= 42 * dt; e.y = e.base + Math.sin(e.t * 1.7) * 24;
        e.fireT -= dt;
        if (e.fireT <= 0) { e.fireT = 2.2 / D; if (onScreen) fan(e.x - 10, e.y, 3, 0.5, 75 + D * 15, Math.atan2(tg.y - e.y, tg.x - e.x)); }
        break;
      case 'mini':
        e.x += e.vx * dt; e.y += e.vy * dt;
        e.vy = clamp(e.vy + (tg.y - e.y) * 1.1 * dt, -70, 70);
        break;
    }
    if (e.x < -40 || e.y < -50 || e.y > H + 50 || e.x > W + 400) e.dead = true;
  }
}

function hurtEnemy(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.06;
  if (e.hp <= 0) killEnemy(e); else sfx.hit();
}
function killEnemy(e) {
  e.dead = true;
  addScore(e.score, e.x, e.y - 8);
  boom(e.x, e.y, e.r > 10 ? 2 : 1, (zoneHue() + 150) % 360);
  sfx.boom();
  if (e.form) {
    e.form.killed++;
    if (e.form.killed === e.form.count && e.form.item) items.push({ x: e.x, y: e.y, kind: e.form.item, t: 0 });
  }
  if (e.type === 'carrier') items.push({ x: e.x, y: e.y, kind: e.item, t: 0 });
}

/* ---------- Jefe ---------- */
function startBoss() {
  const D = diff(), n = zi(), kind = n % 3, hp = Math.round(240 * D * (1 + 0.4 * (PL.length - 1)));
  boss = { x: W + 110, y: H / 2, rx: BOSS_DIMS[kind][0], ry: BOSS_DIMS[kind][1], hp, max: hp,
    t: 0, enter: true, pat: 3, patT: 1.2, sub: 99, subT: 0, mouth: 0, flash: 0, kind, name: BOSSES[n % BOSSES.length], dying: 0 };
}
function bossHit(x, y, pad = 0) {
  const b = boss; if (!b || b.dying > 0) return false;
  const dx = (x - b.x) / (b.rx + pad), dy = (y - b.y) / (b.ry + pad);
  return dx * dx + dy * dy < 1;
}
function updateBoss(dt) {
  const b = boss, D = diff();
  b.t += dt; b.flash = Math.max(0, b.flash - dt); b.mouth = Math.max(0, b.mouth - dt * 2.5);
  if (b.dying > 0) {
    b.dying -= dt; b.x += 12 * dt; b.y += 18 * dt;
    if (Math.random() < 0.5) boom(b.x + rnd(-b.rx, b.rx), b.y + rnd(-b.ry, b.ry), 1, rnd(0, 60));
    if (Math.random() < 0.08) sfx.boom();
    if (b.dying <= 0) {
      for (let j = 0; j < 6; j++) boom(b.x + rnd(-40, 40), b.y + rnd(-20, 20), 3, rnd(10, 50));
      shake = 14; sfx.big(); boss = null; afterBoss();
    }
    return;
  }
  const tx = W - 118 + Math.sin(b.t * 0.45) * 25, ty = H / 2 + Math.sin(b.t * 0.7) * 58;
  if (b.enter) { b.x += (tx - b.x) * Math.min(1, dt * 0.9); b.y += (ty - b.y) * Math.min(1, dt * 2); if (Math.abs(b.x - tx) < 4) b.enter = false; return; }
  b.x += (tx - b.x) * Math.min(1, dt * 2); b.y += (ty - b.y) * Math.min(1, dt * 2);
  const rage = b.hp < b.max * 0.4;
  if (rage && Math.random() < dt * 6) parts.push({ x: b.x + rnd(-b.rx, b.rx) * 0.7, y: b.y + rnd(-b.ry, b.ry) * 0.6, vx: rnd(10, 40), vy: rnd(-30, -5), life: 0.6, max: 0.6, c: 'rgba(160,160,170,.6)', s: rnd(2, 4) });
  b.patT -= dt * (rage ? 1.4 : 1);
  if (b.patT <= 0) { b.pat = (b.pat + 1) % 4; b.patT = 2.7; b.sub = 0; b.subT = 0.2; }
  b.subT -= dt;
  const mx = b.x - b.rx + 2, my = b.y + 6, spd = (78 + D * 20) * (rage ? 1.2 : 1);
  if (b.subT > 0) return;
  switch (b.pat) {
    case 0: if (b.sub < 3) { b.subT = 0.38; b.sub++; b.mouth = 1; fan(mx, my, 5 + Math.floor(D), 1.0, spd, Math.PI + (b.sub - 2) * 0.13); } break;
    case 1: if (b.sub < 6) { b.subT = 0.13; b.sub++; b.mouth = 1; fireAt(mx, my, spd * 1.5, 3); } break;
    case 2: if (b.sub < 4) {
      b.subT = 0.3; b.sub++;
      const up = b.sub % 2 === 1;
      enemies.push(mk('mini', { x: b.x + rnd(-10, 30), y: b.y + (up ? -b.ry : b.ry), vx: -105 - D * 10, vy: up ? -45 : 45 }));
    } break;
    case 3: if (b.sub < 2) { b.subT = 0.55; b.sub++; ring(b.x, b.y, 12 + Math.floor(D * 2), spd * 0.8, b.sub * 0.25 + b.t); } break;
  }
}
function hurtBoss(dmg) {
  const b = boss; if (!b || b.dying > 0 || b.x > W - 30) return;
  b.hp -= dmg; b.flash = 0.05;
  if (b.hp <= 0) {
    b.hp = 0; b.dying = 2.3;
    addScore(Math.round(10000 * (1 + dep * 0.5) * (1 + loop)), b.x, b.y - 30);
    for (const s of eshots) parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 0.3, max: 0.3, c: '#ff9ad5', s: 2 });
    eshots = [];
    for (const e of enemies) if (e.type === 'mini') killEnemy(e);
    sfx.big(); shake = 8;
  }
}
function afterBoss() {
  if (dep < MAX_DEPTH) { state = 'branch'; branchT = 5.5; }
  else { loop++; dep = 0; lane = 0; startZone(); }
}
/* Votan todas las naves que siguen en juego (arriba o abajo); en empate decide el jugador 1. */
function branchVote() {
  let up = 0, down = 0;
  for (const p of PL) { if (p.out) continue; if (p.y < H / 2) up++; else down++; }
  return up === down ? (P.y < H / 2 ? 0 : 1) : up > down ? 0 : 1;
}
function endBranch() {
  dep++; lane += branchVote();
  startZone();
}

/* ---------- Jugadores ---------- */
function shoot(pl) {
  const lv = pl.shot, x = pl.x + 11, y = pl.y;
  if (lv === 0) { shots.push({ x, y, vx: 390, vy: 0, dmg: 1, r: 3 }); pl.fireCd = 0.13; }
  else if (lv === 1) { shots.push({ x, y: y - 3, vx: 390, vy: 0, dmg: 1, r: 3 }, { x, y: y + 3, vx: 390, vy: 0, dmg: 1, r: 3 }); pl.fireCd = 0.12; }
  else if (lv === 2) { for (const a of [-0.15, 0, 0.15]) shots.push({ x, y, vx: Math.cos(a) * 390, vy: Math.sin(a) * 390, dmg: 1, r: 3 }); pl.fireCd = 0.12; }
  else {
    shots.push({ x: x + 6, y, vx: 580, vy: 0, dmg: 1.3, r: 3, laser: true, hit: new Set() });
    for (const a of [-0.12, 0.12]) shots.push({ x, y, vx: Math.cos(a) * 400, vy: Math.sin(a) * 400, dmg: 0.7, r: 3 });
    pl.fireCd = 0.1;
  }
  if (pl === P) sfx.shot();
}
function dropBombs(pl) {
  bombs.push({ x: pl.x, y: pl.y + 3, vx: 140, vy: 110, dir: 1, life: 2.6 });
  if (pl.bomb >= 1) bombs.push({ x: pl.x, y: pl.y - 3, vx: 140, vy: -110, dir: -1, life: 2.6 });
  pl.bombCd = [0.62, 0.5, 0.3][pl.bomb];
}
/* Cuenta atrás de reaparición; devuelve true si la nave está viva. */
function tickRespawn(pl, dt) {
  if (pl.alive) return true;
  if (pl.out) return false;
  pl.respawnT -= dt;
  if (pl.respawnT <= 0) {
    if (pl.lives <= 0) { pl.out = true; if (players().every(p => p.out)) gameOver(); }
    else { Object.assign(pl, { x: 60, y: spawnY(pl.id, multi()), inv: 2.5, alive: true }); pl.sp++; }
  }
  return false;
}
function fireTick(pl, dt, firing) {
  pl.inv = Math.max(0, pl.inv - dt); pl.fireCd -= dt; pl.bombCd -= dt;
  if (firing && pl.fireCd <= 0) shoot(pl);
  if (firing && pl.bombCd <= 0) dropBombs(pl);
}
function updatePlayers(dt) {
  if (tickRespawn(P, dt)) fireTick(P, dt, moveByInput(P, dt));
  if (!net.guests.size || !net.nroom) return;
  const peers = net.nroom.peers();
  for (const [peer, gi] of net.guests) {
    const pl = PL.find(x => x.id === gi.id);
    if (!pl || !tickRespawn(pl, dt)) continue;
    const p = peers.find(x => x.peer === peer), g = p && p.presence;
    if (g) {
      if (Number.isFinite(g.x)) pl.x = clamp(g.x, 12, W - 22);
      if (Number.isFinite(g.y)) pl.y = clamp(g.y, ceilY(pl.x) + 8, floorY(pl.x) - 8);
      pl.tilt = clamp((+g.t || 0) / 10, -1, 1);
      pl.firing = g.f === 1;
    }
    fireTick(pl, dt, pl.firing);
  }
}
function hurtPlayer(pl) {
  if (!pl.alive || pl.inv > 0) return;
  if (pl.arm > 0) {
    pl.arm--; pl.inv = 0.9; sfx.shield();
    for (let j = 0; j < 12; j++) { const a = j / 12 * Math.PI * 2; parts.push({ x: pl.x + Math.cos(a) * 12, y: pl.y + Math.sin(a) * 12, vx: Math.cos(a) * 50, vy: Math.sin(a) * 50, life: 0.35, max: 0.35, c: '#7cc4ff', s: 2 }); }
    return;
  }
  pl.alive = false; pl.respawnT = 2.2; pl.lives--;
  pl.shot = Math.max(0, pl.shot - 1); pl.bomb = Math.max(0, pl.bomb - 1);
  boom(pl.x, pl.y, 3, P_HUE[pl.id]); shake = 10; sfx.die();
  for (const s of eshots) parts.push({ x: s.x, y: s.y, vx: 0, vy: 0, life: 0.3, max: 0.3, c: '#ff9ad5', s: 2 });
  eshots = [];
}
function collectItem(pl, it) {
  sfx.item();
  let label;
  if (it.kind === 'red') { if (pl.shot < 3) { pl.shot++; label = ['', 'DOBLE', 'ONDA', 'LÁSER'][pl.shot]; } }
  else if (it.kind === 'green') { if (pl.bomb < 2) { pl.bomb++; label = pl.bomb === 1 ? 'BOMBA DOBLE' : 'BOMBA RÁPIDA'; } }
  else if (pl.arm < 6) { pl.arm = Math.min(6, pl.arm + 2); label = 'ESCUDO'; }
  if (label) floaters.push({ x: pl.x, y: pl.y - 14, txt: label, life: 1.1, c: ITEM_COL[it.kind] });
  else addScore(1000, pl.x, pl.y - 14);
}

/* ---------- Efectos ---------- */
function boom(x, y, size, hue) {
  const n = 8 + size * 7;
  for (let j = 0; j < n; j++) {
    const a = rnd(0, Math.PI * 2), s = rnd(20, 70 + size * 35);
    const life = rnd(0.3, 0.6 + size * 0.15);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, c: `hsl(${hue + rnd(-25, 25)},100%,${rnd(55, 78)}%)`, s: rnd(1, 2.5) });
  }
  parts.push({ ring: true, x, y, r: 2, vr: 60 + size * 45, life: 0.35, max: 0.35 });
}
function updateFx(dt) {
  for (const p of parts) { p.life -= dt; if (p.ring) p.r += p.vr * dt; else { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; } }
  for (const f of floaters) { f.life -= dt; f.y -= 18 * dt; }
  parts = parts.filter(o => o.life > 0); floaters = floaters.filter(o => o.life > 0);
}

/* ---------- Bucle de actualización (anfitrión o un jugador) ---------- */
function update(dt) {
  time += dt;
  shake = Math.max(0, shake - dt * 30);
  if (net.mode === 'guest') { guestUpdate(dt); return; }
  if (paused) return;
  scroll += SCROLL * dt * (state === 'branch' ? 3 : 1);
  if (state === 'title') return;
  if (state === 'over') overT += dt;

  if (state === 'play' || state === 'branch') updatePlayers(dt);
  if (state === 'play') {
    zoneCard = Math.max(0, zoneCard - dt);
    if (phase === 'waves') {
      zoneT += dt; spawnT -= dt;
      if (spawnT <= 0 && zoneT < BOSS_AT) { spawnWave(); spawnT = rnd(1.7, 2.7) / Math.sqrt(diff()); }
      if (zoneT >= BOSS_AT + 3) { phase = 'warn'; warnT = 4; sfx.warn(); }
    } else if (phase === 'warn') {
      warnT -= dt;
      if (warnT <= 0) { startBoss(); phase = 'boss'; }
    }
    if (boss) updateBoss(dt);
  } else if (state === 'branch') {
    branchT -= dt;
    if (branchT <= 0) endBranch();
  }

  updateEnemies(dt);
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; if (s.x > W + 30 || s.y < -10 || s.y > H + 10) s.dead = true; }
  for (const b of bombs) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.dir > 0 && b.y > floorY(b.x) - 3) { b.y = floorY(b.x) - 3; b.vy = 0; b.vx = 210; }
    if (b.dir < 0 && b.y < ceilY(b.x) + 3) { b.y = ceilY(b.x) + 3; b.vy = 0; b.vx = 210; }
    if (b.x > W + 10 || b.life <= 0) b.dead = true;
  }
  for (const s of eshots) { s.x += s.vx * dt; s.y += s.vy * dt; if (s.x < -10 || s.x > W + 10 || s.y < -10 || s.y > H + 10) s.dead = true; }
  for (const it of items) { it.t += dt; it.x -= 28 * dt; it.y += Math.sin(it.t * 3) * 10 * dt; if (it.x < -10) it.dead = true; }

  // Colisiones: disparos
  for (const s of shots) {
    if (s.dead) continue;
    for (const e of enemies) {
      if (e.dead || (s.laser && s.hit.has(e))) continue;
      const dx = e.x - s.x, dy = e.y - s.y, rr = e.r + s.r;
      if (dx * dx + dy * dy < rr * rr) {
        hurtEnemy(e, s.dmg);
        if (s.laser) s.hit.add(e); else { s.dead = true; break; }
      }
    }
    if (!s.dead && bossHit(s.x, s.y)) {
      if (s.laser) { if (!s.hit.has(boss)) { s.hit.add(boss); hurtBoss(s.dmg * 2); } }
      else { hurtBoss(s.dmg); s.dead = true; parts.push({ x: s.x, y: s.y, vx: -30, vy: rnd(-30, 30), life: 0.15, max: 0.15, c: '#fff6c0', s: 2 }); }
    }
  }
  for (const b of bombs) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead) continue;
      const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + 3;
      if (dx * dx + dy * dy < rr * rr) { hurtEnemy(e, 2); b.dead = true; boom(b.x, b.y, 0, 120); break; }
    }
    if (!b.dead && bossHit(b.x, b.y)) { hurtBoss(2); b.dead = true; boom(b.x, b.y, 0, 120); }
  }
  // Colisiones: jugador 1 (el jugador 2 avisa de sus propios impactos por la red)
  if (state === 'play' || state === 'branch') {
    if (P.alive) {
      for (const s of eshots) {
        const dx = s.x - P.x, dy = s.y - P.y, rr = 2.5 + s.r * 0.8;
        if (dx * dx + dy * dy < rr * rr) { s.dead = true; hurtPlayer(P); break; }
      }
      for (const e of enemies) {
        if (e.dead || !P.alive) continue;
        const dx = e.x - P.x, dy = e.y - P.y, rr = e.r + 3;
        if (dx * dx + dy * dy < rr * rr) { hurtPlayer(P); hurtEnemy(e, 3); }
      }
      if (P.alive && bossHit(P.x, P.y, -4)) hurtPlayer(P);
    }
    for (const it of items) {
      for (const pl of players()) {
        if (it.dead || !pl.alive) continue;
        const dx = it.x - pl.x, dy = it.y - pl.y;
        if (dx * dx + dy * dy < 144) { it.dead = true; collectItem(pl, it); }
      }
    }
  }

  shots = shots.filter(o => !o.dead); bombs = bombs.filter(o => !o.dead); eshots = eshots.filter(o => !o.dead);
  enemies = enemies.filter(o => !o.dead); items = items.filter(o => !o.dead);
  updateFx(dt);
}

/* ---------- Multijugador online (capacidad "room") ----------
   El anfitrión (jugador 1) simula todo y publica una foto compacta del juego en su presencia.
   Cada invitado (jugadores 2 a 4) mueve su nave en local, publica posición, disparo y un contador
   de impactos, y dibuja el resto a partir de la foto del anfitrión. Si la partida está llena,
   quien entra mira como espectador y ocupa el primer puesto que se libere. */
const CODE_CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
const net = {
  mode: 'solo', lobby: null, nroom: null, code: '', busy: false, msg: '', lobbyKey: '',
  guests: new Map(), flip: 0,
  myPeer: null, myId: -1, np: 1, seenHost: false, hostSeenAt: 0, lastSnap: null, lastSp: -1,
  hitN: 0, guard: 0, me: null, prevEnemies: new Map()
};
const netEl = { box: document.getElementById('net'), status: document.getElementById('netStatus'), actions: document.getElementById('netActions') };
const myPl = () => net.myId > 0 ? PL.find(p => p.id === net.myId) || null : null;

function netUI() {
  const a = netEl.actions;
  a.textContent = '';
  const btn = (label, fn, go) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn' + (go ? ' go' : ''); b.textContent = label; b.disabled = net.busy;
    b.addEventListener('click', e => { audioInit(); e.currentTarget.blur(); fn(); });
    a.appendChild(b);
  };
  if (!net.lobby) return;
  if (net.mode === 'solo') {
    const open = openGames();
    btn('CREAR PARTIDA', hostGame);
    for (const g of open) btn(`${g.n < MAX_PLAYERS ? 'UNIRSE A' : 'MIRAR'} ${g.code} (${g.n}/${MAX_PLAYERS})`, () => joinGame(g.code), true);
    netEl.status.textContent = net.msg || (open.length
      ? 'Hay una partida abierta: pulsa «Unirse».'
      : `Crea una partida y pide a tus amigos que abran este mismo juego (hasta ${MAX_PLAYERS} jugadores).`);
  } else if (net.mode === 'host') {
    btn('SALIR', () => leaveGame('Saliste de la partida.'));
    const n = net.guests.size + 1;
    netEl.status.textContent = n > 1
      ? `Partida ${net.code} · ${n}/${MAX_PLAYERS} jugadores. ${state === 'title' ? 'Pulsa Enter o toca la pantalla para empezar.' : 'Pueden entrar más en marcha.'}`
      : `Partida ${net.code} · Esperando jugadores… (puedes empezar solo y se unirán en marcha)`;
  } else {
    btn('SALIR', () => leaveGame('Saliste de la partida.'));
    netEl.status.textContent = !net.seenHost ? `Conectando a la partida ${net.code}…`
      : net.myId > 0 ? `Partida ${net.code} · Eres el jugador ${net.myId + 1}. El jugador 1 pone en marcha cada partida.`
      : `Partida ${net.code} · Está llena (${MAX_PLAYERS}/${MAX_PLAYERS}): miras como espectador y entrarás si se libera un puesto.`;
  }
}
function openGames() {
  if (!net.lobby) return [];
  const out = [];
  for (const p of net.lobby.peers()) {
    const c = p.presence && p.presence.open;
    if (!p.sameTab && typeof c === 'string' && /^[A-Z]{4}$/.test(c) && !out.some(g => g.code === c))
      out.push({ code: c, n: clamp(Number.isFinite(p.presence.n) ? p.presence.n : 1, 1, MAX_PLAYERS) });
  }
  return out;
}
function announceOpen() {
  if (!net.lobby || net.mode !== 'host') return;
  net.lobby.presence({ open: net.code, n: net.guests.size + 1 }).catch(() => {});
}
async function hostGame() {
  if (net.busy) return;
  net.busy = true; netUI();
  const code = Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');
  let nr;
  try { nr = await net.lobby.join('abismo-' + code.toLowerCase()); }
  catch (e) { net.busy = false; net.msg = 'No se pudo crear la partida. Inténtalo de nuevo.'; netUI(); return; }
  Object.assign(net, { busy: false, mode: 'host', nroom: nr, code, guests: new Map(), msg: '' });
  state = 'title'; paused = false; P = newPlayer(0, false); PL = [P]; clearWorld();
  nr.onPeers(() => {}, () => leaveGame('Se perdió la conexión con la partida.'));
  announceOpen();
  nr.presence({ role: 'host' }).catch(() => {});
  netUI();
}
async function joinGame(code) {
  if (net.busy) return;
  net.busy = true; netUI();
  let nr;
  try { nr = await net.lobby.join('abismo-' + code.toLowerCase()); }

      for (let s = 1; s <= 5; s++) ctx.lineTo(j * 4 + Math.sin(e.t * 4 + s + j) * 2.5, 4 + s * 4);

    }
    ctx.fillStyle = fl ? '#fff' : `hsla(${eh + 60},80%,65%,.75)`;
    ctx.beginPath(); ctx.arc(0, 4, 12, Math.PI, 0); ctx.quadraticCurveTo(0, 9, -12, 4); ctx.fill();
    ctx.fillStyle = `hsla(${eh + 60},100%,90%,${0.5 + 0.4 * Math.sin(e.t * 5)})`;
    ctx.beginPath(); ctx.arc(0, -1, 4, 0, Math.PI * 2); ctx.fill();
  } else if (e.type === 'carrier') {
    ctx.rotate(Math.sin(e.t * 2) * 0.15);
    ctx.fillStyle = fl ? '#fff' : `hsl(${eh},25%,40%)`;
    ctx.beginPath();
    for (let j = 0; j < 6; j++) { const a = j / 6 * Math.PI * 2; ctx.lineTo(Math.cos(a) * 14, Math.sin(a) * 11); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = `hsl(${eh},40%,70%)`; ctx.stroke();
    ctx.fillStyle = ITEM_COL[e.item]; ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 9);
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.restore();
}
function drawBoss(b) {
  const h = (zoneHue() + 170 + b.kind * 40) % 360, fl = b.flash > 0;
  const metal = fl ? '#ffffff' : `hsl(${h},22%,58%)`, dark = fl ? '#dddddd' : `hsl(${h},28%,26%)`;
  const glow = `hsl(${(h + 180) % 360},100%,62%)`;
  ctx.save(); ctx.translate(b.x, b.y);
  const sw = Math.sin(b.t * 3) * 6;
  if (b.kind === 2) {
    ctx.fillStyle = dark;
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-30, s * 8); ctx.lineTo(28, s * (62 + sw)); ctx.lineTo(48, s * 12); ctx.closePath(); ctx.fill(); }
  }
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.moveTo(b.rx - 10, 0); ctx.lineTo(b.rx + 38, -28 + sw); ctx.lineTo(b.rx + 26, 0); ctx.lineTo(b.rx + 38, 28 + sw); ctx.closePath(); ctx.fill();
  const n = b.kind === 1 ? 9 : 5;
  for (let j = 0; j < n; j++) {
    const px = -b.rx * 0.55 + j * (b.rx * 1.25 / n), q = 1 - (px / b.rx) ** 2, top = -b.ry * Math.sqrt(Math.max(0, q));
    ctx.beginPath(); ctx.moveTo(px - 6, top + 3); ctx.lineTo(px + 5, top - 10 - (j % 2) * 5); ctx.lineTo(px + 7, top + 3); ctx.fill();
    ctx.beginPath(); ctx.moveTo(px - 4, -top - 3); ctx.lineTo(px + 6, -top + 7); ctx.lineTo(px + 6, -top - 3); ctx.fill();
  }
  const g = ctx.createLinearGradient(0, -b.ry, 0, b.ry);
  g.addColorStop(0, metal); g.addColorStop(0.55, dark); g.addColorStop(1, metal);

  ctx.strokeStyle = `hsla(${h},40%,12%,.75)`; ctx.lineWidth = 1.2;
  for (let x = -b.rx * 0.45; x < b.rx * 0.85; x += 13) {
    const ry = b.ry * Math.sqrt(Math.max(0, 1 - (x / b.rx) ** 2)) * 0.96;
    ctx.beginPath(); ctx.ellipse(x, 0, 5, ry, 0, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  }
  ctx.fillStyle = `hsla(${h},40%,85%,.35)`;
  ctx.beginPath(); ctx.ellipse(-8, -b.ry * 0.55, b.rx * 0.6, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#120509';
  ctx.beginPath(); ctx.moveTo(-b.rx - 1, 4); ctx.lineTo(-b.rx + 22, 4); ctx.lineTo(-b.rx + 2, 6 + 10 * b.mouth); ctx.closePath(); ctx.fill();
  if (b.mouth > 0) { ctx.fillStyle = glow; ctx.globalAlpha = Math.min(1, b.mouth); ctx.beginPath(); ctx.arc(-b.rx + 4, 6, 3 + b.mouth * 3, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
  ctx.fillStyle = '#0b0b12'; ctx.beginPath(); ctx.arc(-b.rx + 20, -7, 5.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = glow; ctx.globalAlpha = 0.7 + 0.3 * Math.sin(b.t * 6);
  ctx.beginPath(); ctx.arc(-b.rx + 19, -7, 3, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  ctx.restore();
}
function drawItem(it) {
  const c = ITEM_COL[it.kind];
  ctx.save(); ctx.translate(it.x, it.y);
  ctx.globalAlpha = 0.3; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(0, 0, 9 + Math.sin(it.t * 8), 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 7);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, c); g.addColorStop(1, '#101018');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill();
  text(ITEM_TXT[it.kind], 0.5, 0.5, 7, '#ffffff', 'center', true);
  ctx.restore();
}
/* Bloque de vidas y armas de una nave. Con 3 o 4 naves se usa la versión compacta. */
function drawPlayerHUD(pl, x0, right, compact) {
  const ops = [], y = H - 8, pip = (v, max, c) => { for (let s = 0; s < max; s++) ops.push([4, x => { ctx.fillStyle = s < v ? c : 'rgba(255,255,255,.18)'; ctx.fillRect(x, H - 11, 3, 6); }]); };
  if (multi()) ops.push([14, x => text((pl.id + 1) + 'P', x, y, 7, P_COL[pl.id], 'left', true)]);
  if (pl.out) ops.push([compact ? 30 : 44, x => text(compact ? 'FUERA' : 'SIN NAVES', x, y, 6, '#ff9ab0')]);
  else if (compact) { ops.push([12, x => drawShip(x + 6, y, 0, 0.5, pl.id)]); ops.push([10, x => text(String(pl.lives), x, y, 6, '#ffffff')]); }
  else {
    for (let j = 0; j < Math.min(pl.lives, 4); j++) ops.push([13, x => drawShip(x + 6, y, 0, 0.5, pl.id)]);
    if (pl.lives > 4) ops.push([16, x => text('x' + pl.lives, x, y, 6, '#ffffff')]);
  }
  ops.push([compact ? 2 : 6, () => {}]);
  for (const [ch, v, max, c] of [['M', pl.shot, 3, ITEM_COL.red], ['B', pl.bomb, 2, ITEM_COL.green], ['E', pl.arm, 6, ITEM_COL.blue]]) {
    ops.push([7, x => text(ch, x, y, 6, c)]);
    if (compact && ch === 'E') pip(Math.ceil(v / 2), 3, c); else pip(v, max, c);
    ops.push([compact ? 3 : 5, () => {}]);
  }
  const total = ops.reduce((a, o) => a + o[0], 0);
  let x = right ? x0 - total : x0;
  for (const [w, fn] of ops) { fn(x); x += w; }
}
function drawHUD() {
  const pad = (n, l) => String(n).padStart(l, '0');
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, 0, W, 13);
  text((multi() ? 'EQUIPO ' : '1P ') + pad(score, 8), 6, 7, 8, '#ffffff');
  text('HI ' + pad(Math.max(hi, score), 8), W / 2, 7, 8, '#ffc93c', 'center');
  text('ZONA ' + letter() + (loop ? ' · V' + (loop + 1) : ''), W - 6, 7, 8, '#9fe3ff', 'right');
  if (PL.length <= 2) {
    drawPlayerHUD(PL[0], 6, false, false);
    if (PL[1]) drawPlayerHUD(PL[1], W - 6, true, false);
  } else {
    const slot = (W - 12) / PL.length;
    PL.forEach((pl, i) => drawPlayerHUD(pl, 6 + i * slot, false, true));
  }
  if (boss && !boss.enter) {
    const w = 160, bx = W / 2 - w / 2;
    text(boss.name, W / 2, 19, 6, '#ff9ab0', 'center');
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(bx, 24, w, 3);
    ctx.fillStyle = '#ff4d6d'; ctx.fillRect(bx, 24, w * boss.hp / boss.max, 3);
  }
}
function drawOverlay() {
  if (state === 'play' && zoneCard > 0) {
    const a = Math.max(0, Math.min(1, zoneCard, (3 - zoneCard) * 3));
    ctx.globalAlpha = a;
    text(loop && dep === 0 && lane === 0 ? 'VUELTA ' + (loop + 1) : 'ZONA ' + letter(), W / 2, H / 2 - 14, 22, '#ffffff', 'center', true);
    text(ZONES[zi()].toUpperCase(), W / 2, H / 2 + 8, 8, '#9fe3ff', 'center');
    ctx.globalAlpha = 1;
  }
  if (state === 'play' && phase === 'warn') {
    const on = Math.floor(time * 4) % 2 === 0;
    ctx.fillStyle = 'rgba(120,0,20,.28)'; ctx.fillRect(0, H / 2 - 34, W, 68);
    ctx.fillStyle = '#ff4d5e'; ctx.fillRect(0, H / 2 - 34, W, 2); ctx.fillRect(0, H / 2 + 32, W, 2);
    if (on) text('¡ATENCIÓN!', W / 2, H / 2 - 16, 18, '#ff4d5e', 'center', true);
    text('UN ACORAZADO GIGANTE SE APROXIMA A TODA VELOCIDAD', W / 2, H / 2 + 6, 7, '#ffd6dc', 'center');
    text(BOSSES[zi() % BOSSES.length], W / 2, H / 2 + 20, 9, '#ffffff', 'center', true);
  }
  if (state === 'branch' && dep < MAX_DEPTH) {
    const up = branchVote() === 0;
    const base = (dep + 1) * (dep + 2) / 2 + lane;
    const zones = [[letter(dep + 1, lane), ZONES[base]], [letter(dep + 1, lane + 1), ZONES[base + 1]]];
    for (let j = 0; j < 2; j++) {
      const y0 = j ? H / 2 : 14, sel = (j === 0) === up;
      ctx.fillStyle = sel ? 'rgba(120,220,255,.14)' : 'rgba(0,0,0,.25)'; ctx.fillRect(0, y0, W, H / 2 - 14);
      text((j ? '▼ ' : '▲ ') + 'ZONA ' + zones[j][0], W - 20, y0 + (H / 2 - 14) / 2 - 6, 12, sel ? '#ffffff' : '#7d8ea3', 'right', true);
      text(zones[j][1].toUpperCase(), W - 20, y0 + (H / 2 - 14) / 2 + 8, 7, sel ? '#9fe3ff' : '#5f7189', 'right');
    }
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(0, H / 2, W, 1);
    text('ZONA DESPEJADA · ELIGE TU RUTA', 16, 26, 8, '#ffc93c');
    if (multi()) text('VOTAN TODAS LAS NAVES · EMPATE: DECIDE EL 1P', 16, 38, 6, '#c9d6e3');
    text(String(Math.ceil(branchT)), 16, H / 2, 20, '#ffffff', 'left', true);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    text('PAUSA', W / 2, H / 2 - 6, 20, '#ffffff', 'center', true);
    text(net.mode === 'guest' ? 'EL JUGADOR 1 PAUSÓ LA PARTIDA' : 'P O TOCA PARA SEGUIR', W / 2, H / 2 + 14, 7, '#c9d6e3', 'center');
  }
  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    text('FIN DE LA PARTIDA', W / 2, H / 2 - 26, 18, '#ff4d5e', 'center', true);
    text('PUNTOS ' + score, W / 2, H / 2, 10, '#ffffff', 'center');
    if (newHi) text('¡NUEVO RÉCORD!', W / 2, H / 2 + 14, 8, '#ffc93c', 'center');
    if (overT > 1 && Math.floor(time * 2) % 2 === 0)
      text(net.mode === 'guest' ? 'ESPERANDO AL JUGADOR 1' : 'ENTER O TOCA PARA REINTENTAR', W / 2, H / 2 + 34, 7, '#c9d6e3', 'center');
  }
}
function drawTitle() {
  const bob = Math.sin(time * 2) * 4;
  const n = net.mode === 'host' ? net.guests.size + 1 : net.mode === 'guest' ? net.np : 1;
  if (n === 1) drawShip(110, 150 + bob, 0, 2.6, 0);
  else for (let j = 0; j < n; j++) drawShip(118 - (j % 2) * 26, 128 + j * (78 / (n - 1)) + (j % 2 ? -bob : bob), 0, n > 2 ? 1.7 : 2.2, j);
  for (let j = 0; j < 3; j++) drawFish({ x: 330 + j * 28, y: 150 + Math.sin(time * 2.4 + j * 0.6) * 18, t: time, flash: 0 }, 350, 1.3);
  text('ABISMO', W / 2, 62, 34, '#ffc93c', 'center', true);
  text('ESTELAR', W / 2, 94, 20, '#9fe3ff', 'center', true);
  let line = 'PULSA ENTER O TOCA LA PANTALLA', sub = '', col = '#ffffff';
  if (net.mode === 'host') {
    line = n > 1 ? `${n}/${MAX_PLAYERS} JUGADORES · PULSA ENTER O TOCA` : 'ESPERANDO JUGADORES…';
    sub = 'PARTIDA ' + net.code + (n > 1 ? '' : ' · ENTER PARA EMPEZAR SOLO');
    col = P_COL[1];
  } else if (net.mode === 'guest') {
    line = !net.seenHost ? 'CONECTANDO…' : net.myId > 0 ? `CONECTADO COMO JUGADOR ${net.myId + 1}` : 'PARTIDA LLENA · MIRAS COMO ESPECTADOR';
    sub = `${n}/${MAX_PLAYERS} JUGADORES · ESPERANDO A QUE EL JUGADOR 1 EMPIECE`;
    col = net.myId > 0 ? P_COL[net.myId] : '#c9d6e3';
  }
  if (Math.floor(time * 2) % 2 === 0 || net.mode !== 'solo') text(line, W / 2, 200, 8, col, 'center');
  if (sub) text(sub, W / 2, 213, 6, '#c9d6e3', 'center');
  text('ORBES:  M = MISIL   B = BOMBA   E = ESCUDO', W / 2, 232, 6, '#c9d6e3', 'center');

}
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  const sx = RM ? 0 : rnd(-shake, shake) * 0.5, sy = RM ? 0 : rnd(-shake, shake) * 0.5;
  ctx.setTransform(k, 0, 0, k, sx * k, sy * k);

  for (const it of items) drawItem(it);
  for (const e of enemies) drawEnemy(e);

  for (const b of bombs) { ctx.fillStyle = '#3dff7a'; ctx.beginPath(); ctx.moveTo(b.x + 3, b.y); ctx.lineTo(b.x, b.y - 2); ctx.lineTo(b.x - 3, b.y); ctx.lineTo(b.x, b.y + 2); ctx.fill(); }

      ctx.fillStyle = 'rgba(80,220,255,.35)'; ctx.fillRect(s.x - 26, s.y - 2.5, 30, 5);
      ctx.fillStyle = '#e6fbff'; ctx.fillRect(s.x - 26, s.y - 1, 30, 2);

      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));

      ctx.fillStyle = '#fff6c0'; ctx.fillRect(-2, -1, 5, 2);
      ctx.restore();
    }
  }
  for (const pl of players()) {
    if (!pl.alive || (pl.inv > 0 && Math.floor(time * 16) % 2 === 0)) continue;
    drawShip(pl.x, pl.y, pl.tilt, 1, pl.id);
    if (multi()) text((pl.id + 1) + 'P', pl.x, pl.y - 13, 5, P_COL[pl.id], 'center');
    if (pl.arm > 0) {
      ctx.strokeStyle = `rgba(90,170,255,${0.3 + pl.arm * 0.1})`; ctx.lineWidth = 1 + pl.arm * 0.3;

  for (const s of eshots) {
    ctx.fillStyle = 'rgba(255,60,140,.45)'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r + 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe1f0'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.6, 0, Math.PI * 2); ctx.fill();

  for (const p of parts) {

  drawHUD();
  drawOverlay();
}

P = newPlayer(0, false); PL = [P];
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  if (net.mode === 'host') netHostTick();
  render(); musicTick();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
